services:
  - type: web
    name: lifeos-cloud
    env: python
    buildCommand: "pip install -r requirements.txt || true"
    startCommand: "python server.py"
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GEMINI_API_KEY
        sync: false
